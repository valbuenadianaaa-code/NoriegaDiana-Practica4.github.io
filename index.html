<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practica4</title>
    <!--DIANA NORIEGA VALBUENA 02/10/26 -->
    
    <style>

        /* ESTILO GENERAL */
        body {
            margin: 0;
            padding: 0;
            background-color: #FFF8F0;
            color: #6D6875;
            font-family: Arial, sans-serif;
        }

        /* TÍTULO SUPERIOR */
        .titulo-superior {
            text-align: center;
            font-family: "Courier New", monospace;
            font-size: 32px;
            font-weight: bold;
            color: #6D6875;
            margin-top: 35px;
            margin-bottom: 25px;
        }

        /* ENCABEZADO RESERVACIONES */
        .reservaciones {
            background-color: #F8C8DC;
            color: #6D6875;
            text-align: center;
            padding: 15px;
            font-size: 58px;
            font-weight: bold;
            margin-bottom: 65px;
            border-radius: 0 0 25px 25px;
        }

        /*  NOMBRE */
        .nombre {
            text-align: center;
            font-family: "Courier New", monospace;
            font-size: 42px;
            font-weight: bold;
            color: #8A7181;
            margin-bottom: 55px;
        }

        /* FORMULARIO  */
        .formulario {
            width: 650px;
            margin: auto;
            background-color: #FFFDF9;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(109, 104, 117, 0.15);
            box-sizing: border-box;
        }

        /* FILAS */
        .fila {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        /*  ETIQUETAS  */
        label {
            width: 280px;
            font-size: 17px;
            color: #6D6875;
            font-weight: 500;
        }

        /* CAMPOS  */
        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="password"] {
            width: 300px;
            height: 34px;
            border: 2px solid #DDE8D5;
            border-radius: 18px;
            background-color: #F0F5EB;
            color: #6D6875;
            padding: 0 15px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        /* Efecto al seleccionar un campo */

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #F4A6A6;
            background-color: #FFF4F1;
        }

        /*  PLACEHOLDER  */
        input::placeholder {
            color: #9A929B;
            opacity: 1;
        }

        /* RADIO BUTTONS */
        .opciones {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #6D6875;
            font-size: 16px;
        }

        input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #F4A6A6;
            margin: 0 3px 0 0;
        }

        /*  PASATIEMPOS  */

        .pasatiempos {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pasatiempos label {
            width: auto;
            display: flex;
            align-items: center;
            color: #6D6875;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #A8C3A0;
            margin-right: 8px;
        }

        /*  SELECT  */
        select {
            width: 150px;
            height: 34px;
            border: 2px solid #DDE8D5;
            border-radius: 18px;
            background-color: #F0F5EB;
            color: #6D6875;
            font-size: 16px;
            padding-left: 10px;
            outline: none;
        }

        /*  COMENTARIOS  */
        textarea {
            width: 300px;
            height: 65px;
            border: 2px solid #DDE8D5;
            border-radius: 15px;
            background-color: #F0F5EB;
            color: #6D6875;
            padding: 10px;
            font-size: 16px;
            resize: none;
            outline: none;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: #F4A6A6;
            background-color: #FFF4F1;
        }

        /*  BOTÓN  */
        .boton {
            display: block
            width: 300px;
            height: 38px;
            margin: 20px auto 0 auto;
            border: none;
            border-radius: 20px;
            background-color: #F4A6A6;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Efecto del botón */
        .boton:hover {
            background-color: #E89595;
            transform: scale(1.02);
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            .reservaciones {
                font-size: 40px;
                margin-bottom: 40px;
            }

            .nombre {
                font-size: 30px;
                margin-bottom: 35px;
            }

            .formulario {
                width: 90%;
                padding: 25px;
            }
			
            .fila {
                flex-direction: column;
                align-items: flex-start;
                margin-bottom: 18px;
            }

            .fila > label {
                width: 100%;
                margin-bottom: 7px;
            }

            input[type="text"],
            input[type="number"],
            input[type="email"],
            input[type="password"],
            textarea {
				width: 100%;
            }
            .boton {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- TÍTULO SUPERIOR -->

    <div class="titulo-superior">Formulario de registro</div>


    <!-- ENCABEZADO -->

    <div class="reservaciones">Reservaciones</div>


    <!-- NOMBRE -->

    <div class="nombre"> Noriega Valbuena Diana </div>


    <!-- FORMULARIO -->

    <form class="formulario">

        <!-- NOMBRE -->
        <div class="fila">
            <label for="nombre">Ingresa tu nombre: </label>
            <input type="text" id="nombre" name="nombre">
        </div>

        <!-- APELLIDOS -->
        <div class="fila">
            <label for="apellidos">Ingresa tus apellidos:</label>
            <input type="text" id="apellidos" name="apellidos">
        </div>

        <!-- EDAD -->
        <div class="fila">
            <label for="edad">Ingresa tu edad: </label>
            <input type="number" id="edad" name="edad">
        </div>

        <!-- CORREO -->
        <div class="fila">
            <label for="correo">Ingresa tu correo e.: </label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@dominio.com">
        </div>

        <!-- CLAVE DE ACCESO -->
        <div class="fila">
            <label for="clave">Ingresa tu clave de acceso: </label>
            <input type="password" id="clave" name="clave">
        </div>

        <!-- GÉNERO -->
        <div class="fila">

            <label>Ingresa tu genero: </label>
            <div class="opciones">

                <input type="radio" id="masculino" name="genero" value="masculino">
                <span>masculino</span>

                <input type="radio" id="femenino" name="genero" value="femenino">
                <span>femenino</span>
            </div>
        </div>

        <!-- PASATIEMPOS -->
        <div class="fila">
        
            <label>Especifica tus pasatiempos</label>
            <div class="pasatiempos">

                <label>
                    <input type="checkbox" name="pasatiempos" value="computacion">computación
                </label>

                <label>
                    <input type="checkbox" name="pasatiempos" value="negocios"> negocios
                </label>

                <label>
                    <input type="checkbox" name="pasatiempos" value="inteligencia-artificial"> inteligencia artificial
                </label>

                <label>
                    <input type="checkbox" name="pasatiempos" value="deportes"> deportes
                </label>

                <label>
                    <input type="checkbox" name="pasatiempos" value="viajes"> viajes
                </label>
            </div>
        </div>

        <!-- ESTADO CIVIL -->
        <div class="fila">
            <label for="estado">Ingresa tu estado civil: </label>

            <select id="estado" name="estado">
                <option value="casada">casada/o</option>
                <option value="soltera">soltera/o</option>
                <option value="divorciada">divorciada/o</option>
                <option value="viuda">viuda/o</option>
            </select>
        </div>

        <!-- COMENTARIOS -->
        <div class="fila">
            <label for="comentarios">Comentarios adicionales: </label>
            <textarea id="comentarios" name="comentarios" placeholder="Escribe aquí tus comentarios..." ></textarea>
        </div>

        <!-- CONTRASEÑA -->
        <div class="fila">
            <label for="contrasena"> Ingresa tu contraseña: </label>
            <input type="password" id="contrasena" name="contrasena">
        </div>

        <!-- BOTÓN -->
        <button type="submit" class="boton">Enviar valores</button>

    </form>

</body>
</html>
